services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mercury-backend:latest
    container_name: mercury-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENV=development
    volumes:
      - ./backend:/app/backend:ro
      - ./ml:/app/ml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
