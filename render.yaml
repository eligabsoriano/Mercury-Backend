services:
  - type: web
    name: mercury-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: starter
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
      - key: API_KEYS
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_DEFAULT_TTL_SECONDS
        value: "300"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
