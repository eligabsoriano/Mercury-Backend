name: Continuous Integration

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint checks (ruff check)
        run: ruff check backend/ ml/ tests/ scripts/

      - name: Formatter checks (ruff format)
        run: ruff format --check backend/ ml/ tests/ scripts/

      - name: Run test suite (pytest)
        env:
          REQUIRE_AUTH: "false"
          ENV: "test"
        run: pytest tests/ -v
